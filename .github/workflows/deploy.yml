name: Build and Deploy

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Auth Service
        run: |
          docker build \
            -f apps/auth-service/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/miro-auth:latest .

      - name: Build Board Service
        run: |
          docker build \
            -f apps/board-service/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/miro-board:latest .

      - name: Build Collab Service
        run: |
          docker build \
            -f apps/collab-service/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/miro-collab:latest .

      - name: Build API Gateway
        run: |
          docker build \
            -f apps/api-gateway/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/miro-gateway:latest .

      - name: Push Docker Images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/miro-auth:latest
          docker push ghcr.io/${{ github.repository_owner }}/miro-board:latest
          docker push ghcr.io/${{ github.repository_owner }}/miro-collab:latest
          docker push ghcr.io/${{ github.repository_owner }}/miro-gateway:latest

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/miro-clone

            docker login ghcr.io \
              -u ${{ github.repository_owner }} \
              -p ${{ secrets.GITHUB_TOKEN }}

            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml up -d

            docker image prune -f