name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: |
          npm install
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker build -t auth-service:latest   apps/auth-service
          docker build -t board-service:latest  apps/board-service
          docker build -t collab-service:latest apps/collab-service
          docker build -t api-gateway:latest    apps/api-gateway

      - name: Save Docker images
        run: |
          docker save auth-service:latest   | gzip > auth-service.tar.gz
          docker save board-service:latest  | gzip > board-service.tar.gz
          docker save collab-service:latest | gzip > collab-service.tar.gz
          docker save api-gateway:latest    | gzip > api-gateway.tar.gz

      - name: Copy images to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host:        ${{ secrets.VM_HOST }}
          username:    ubuntu
          key:         ${{ secrets.VM_SSH_KEY }}
          source:      "*.tar.gz,docker-compose.prod.yml"
          target:      ~/miro-clone

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ubuntu
          key:      ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/miro-clone

            # load new images
            docker load < auth-service.tar.gz
            docker load < board-service.tar.gz
            docker load < collab-service.tar.gz
            docker load < api-gateway.tar.gz

            # restart services with new images
            docker compose -f docker-compose.prod.yml --env-file .env up -d

            # clean up tar files
            rm -f *.tar.gz

            echo "✅ Deployment complete"